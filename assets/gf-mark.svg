<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <!-- Full orange circle -->
  <circle cx="110" cy="110" r="100" fill="#F4743B"/>

  <!-- White gap sector — cuts the upper-right opening of the G -->
  <!-- Gap: from -32° (top: ~194,57) to 0° (3 o'clock: 210,110) -->
  <path d="M 110,110 L 195,57 A 100,100 0 0,1 210,110 Z" fill="white"/>

  <!-- 4 organic white petals (compass / soccer-panel icon) -->
  <!-- Top petal -->
  <path d="M 103,101 C 86,88 85,63 110,46 C 135,63 134,88 117,101 Z" fill="white"/>
  <!-- Bottom petal -->
  <path d="M 103,119 C 86,132 85,157 110,174 C 135,157 134,132 117,119 Z" fill="white"/>
  <!-- Left petal -->
  <path d="M 101,103 C 88,86 63,85 46,110 C 63,135 88,134 101,117 Z" fill="white"/>
  <!-- Right petal (partially in gap — still drawn) -->
  <path d="M 119,103 C 132,86 157,85 174,110 C 157,135 132,134 119,117 Z" fill="white"/>

  <!-- Orange center circle (caps the petal intersection) -->
  <circle cx="110" cy="110" r="15" fill="#F4743B"/>
</svg>
